<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - HTML con Errores (Para Corregir)</title>
</head>

<body>
    <!-- Este HTML tiene errores intencionales para que los corrijas -->

    <h1>Título Principal
        <!-- Error: etiqueta sin cerrar -->

        <p>Este es un párrafo con <strong>texto en negrita</p></strong>
        <!-- Error: etiquetas mal anidadas -->

        <img src="foto.jpg">
        <!-- Error: falta atributo alt -->

        <div id="contenedor">
            <p>Contenido 1</p>
        </div>

        <div id="contenedor">
            <p>Contenido 2</p>
        </div>
        <!-- Error: IDs duplicados -->

        <a href=pagina.html>Enlace</a>
        <!-- Error: atributo sin comillas -->

        <p>5 < 10 & 10> 5</p>
        <!-- Error: caracteres especiales sin escapar -->
</body>

</html>
