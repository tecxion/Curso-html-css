<!DOCTYPE html>
<html lang="es">
<!--Crea un formulario simple de comentarios que incluya campos para nombre (text), email (email) 
    y un área de comentarios (textarea) con 8 filas y 60 columnas. Añade un botón de envío. 
    Todos los campos deben ser obligatorios.-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Comentarios</title>
</head>

<body>
    <h1>Formulario de Comentarios</h1>
    <form action="#" method="post">
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="8" cols="60" required></textarea><br><br>
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
