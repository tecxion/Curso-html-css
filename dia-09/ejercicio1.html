<!--Crea un formulario de inicio de sesión simple que incluya campos para nombre de usuario (text), contraseña (password) 
y un botón de envío. Todos los campos deben ser obligatorios y tener placeholders apropiados.-->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Formulario de Login - Dia 9</title>
</head>

<body>
    <h1>Formulario de Login</h1>
    <form action="/login" method="post">
        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" placeholder="Ingresa tu nombre de usuario" required>
        <br><br>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
        <br><br>
        <input type="submit" value="Iniciar Sesión">

</html>
