<!-- Crea un formulario de reserva de hotel que incluya los siguientes campos: nombre completo (text, requerido), 
 email (email, requerido), teléfono (tel), número de huéspedes (number, mínimo 1, máximo 6), sitio web opcional 
 (url), y botones de enviar y resetear. Usa placeholders descriptivos 
 en todos los campos y asegúrate de que cada input tenga su label asociado correctamente.-->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Dia 9</title>
</head>

<body>
    <h1>Formulario de Reserva de Hotel</h1>
    <form action="/reservar" method="post">
        <label for="nombre-completo">Nombre Completo:</label>
        <input type="text" id="nombre-completo" name="nombre-completo" placeholder="Ingresa tu nombre completo"
            required>
        <br><br>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
        <br><br>
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu número de teléfono">
        <br><br>
        <label for="num-huespedes">Número de Huéspedes:</label>
        <input type="number" id="num-huespedes" name="num-huespedes" placeholder="1-6" min="1" max="6" required>
        <br><br>
        <label for="sitio-web">Sitio Web (opcional):</label>
        <input type="url" id="sitio-web" name="sitio-web" placeholder="Ingresa tu sitio web">
        <br><br>
        <input type="submit" value="Reservar">
        <input type="reset" value="Resetear">
    </form>
</body>

</html>
