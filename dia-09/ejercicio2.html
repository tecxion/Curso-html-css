<!-- Crea un formulario de suscripción que incluya campos para nombre (text), email (email) 
 y un botón de suscripción. El formulario debe usar el método GET y todos los campos deben tener 
 sus respectivos <label> correctamente asociados.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Día 9 </title>
</head>

<body>
    <h1>Formulario de suscripción a newsletter</h1>
    <form action="/suscribirse" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        <br><br>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="tu@mail.com" required>
        <input type="submit" value="Suscribirse">
    </form>
</body>

</html>
