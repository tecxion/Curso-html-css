<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Formas SVG</title>
</head>

<body>
    <h1>Composición con SVG</h1>

    <svg width="400" height="400" style="border: 1px solid #ccc;">
        <!-- Cielo -->
        <rect x="0" y="0" width="400" height="200" fill="#87CEEB" />

        <!-- Sol -->
        <circle cx="350" cy="50" r="30" fill="#FFD700" />

        <!-- Tierra -->
        <rect x="0" y="200" width="400" height="200" fill="#90EE90" />

        <!-- Casa -->
        <rect x="150" y="180" width="100" height="80" fill="#D2691E" />
        <polygon points="150,180 200,140 250,180" fill="#8B4513" />

        <!-- Puerta -->
        <rect x="180" y="220" width="40" height="40" fill="#654321" />

        <!-- Ventanas -->
        <rect x="160" y="195" width="25" height="20" fill="#87CEEB" />
        <rect x="215" y="195" width="25" height="20" fill="#87CEEB" />
    </svg>
</body>

</html>
