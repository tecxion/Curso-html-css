<!--Crea una tabla de horario escolar que use colspan para el título principal y 
rowspan para los días de la semana. Debe tener al menos 3 días y 4 horas diferentes.-->

<DOCTYPE html>
    <html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Horario Escolar</title>
    </head>

    <body>
        <h1>Ejercicio resuelto nº 1 - Día 8</h1>
        <table border="1">
            <tr>
                <th colspan="5">Horario Escolar</th>
            </tr>
            <tr>
                <td rowspan="2">Lunes</td>
                <td>8:00 - 9:00</td>
                <td>Matemáticas</td>
            </tr>
            <tr>
                <td>9:00 - 10:00</td>
                <td>Ciencias</td>
            </tr>
            <tr>
                <td rowspan="2">Martes</td>
                <td>8:00 - 9:00</td>
                <td>Historia</td>
            </tr>
            <tr>
                <td>9:00 - 10:00</td>
                <td>Lengua</td>
            </tr>
            <tr>
                <td rowspan="2">Miércoles</td>
                <td>8:00 - 9:00</td>
                <td>Inglés</td>
            </tr>
            <tr>
                <td>9:00 - 10:00</td>
                <td>Educación Física</td>
            </tr>
        </table>
    </body>

    </html>
