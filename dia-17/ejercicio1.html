<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Video de YouTube Embebido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            color: #333;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            margin: 2rem 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <h1>Tutorial: Introducción a HTML5</h1>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/UB1O30fR-EE" title="Tutorial de HTML5" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>

    <p><strong>Duración:</strong> 1 hora 40 minutos</p>
    <p>En este tutorial completo aprenderás los fundamentos de HTML5 desde cero.</p>
</body>

</html>
