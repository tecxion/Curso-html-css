<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Class e ID</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: #f4f4f4;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .highlight {
            background: #FFD700;
        }

        #header {
            background: #4A90E2;
            color: white;
            padding: 20px;
        }
    </style>
    <link rel="stylesheet" href="styles/ejercicio1.css">
</head>

<body>
    <header id="header">
        <h1>Uso de Class e ID</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>Tarjeta 1</h2>
            <p>Contenido de la tarjeta 1</p>
        </div>

        <div class="card highlight">
            <h2>Tarjeta 2 (Destacada)</h2>
            <p>Contenido de la tarjeta 2</p>
        </div>

        <div class="card">
            <h2>Tarjeta 3</h2>
            <p>Contenido de la tarjeta 3</p>
        </div>
    </div>
</body>

</html>
